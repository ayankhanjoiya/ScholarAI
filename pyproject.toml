[project]
name = "scholarai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Valerionayan", email = "ayankhanjoiya@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.18.1",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.27",
]

[project.scripts]
scholarai = "scholarai:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
